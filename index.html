<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doahang Studio - 沉浸式图文视频演示大屏</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#030712',
                        card: '#0b0f19'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 5s ease-in-out infinite; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-white overflow-x-hidden">

    <!-- 顶部导航栏 -->
    <header class="fixed top-0 left-0 right-0 z-50 glass border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-black text-lg shadow-lg shadow-cyan-500/30">D</div>
                <span class="font-extrabold tracking-wider text-base bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">DOAHANG STUDIO</span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-medium">⚡ 极速稳定运行中</span>
            </div>
        </div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-6xl mx-auto px-6 pt-32 pb-20 space-y-16">
        
        <!-- 头部 Banner -->
        <div class="text-center space-y-6 max-w-3xl mx-auto">
            <span class="inline-block text-xs uppercase tracking-widest text-cyan-400 font-bold px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/20 animate-float">Next-Gen Media Showcase</span>
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white leading-tight">
                为年轻一代打造的<br><span class="bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">图文视频演示空间</span>
            </h1>
            <p class="text-slate-400 text-base sm:text-lg">融合极客暗黑美学与多媒体交互，完美呈现各类图文指南与视频演示内容。</p>
        </div>

        <!-- 演示卡片网格：图文与视频混排 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 卡片一：图文展示 -->
            <div class="rounded-2xl bg-[#0b0f19] border border-slate-800/80 overflow-hidden hover:border-cyan-500/50 transition group">
                <div class="h-48 overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="Demo">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent"></div>
                </div>
                <div class="p-6 space-y-4">
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400">图文教程</span>
                    <h3 class="text-xl font-bold text-white">现代化前端交互与视觉设计指南</h3>
                    <p class="text-sm text-slate-400 leading-relaxed">深入探讨如何利用纯前端与全球 CDN 节点构建媲美原生应用的网页体验，拒绝沉闷与冗余。</p>
                </div>
            </div>

            <!-- 卡片二：视频嵌入展示 -->
            <div class="rounded-2xl bg-[#0b0f19] border border-slate-800/80 overflow-hidden hover:border-indigo-500/50 transition group flex flex-col justify-between">
                <div class="p-6 space-y-4">
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-cyan-500/10 text-cyan-400">视频演示</span>
                    <h3 class="text-xl font-bold text-white">全流程多媒体视频在线演示</h3>
                    <!-- 嵌入视频 -->
                    <div class="rounded-xl overflow-hidden border border-slate-800 bg-black aspect-video">
                        <video controls class="w-full h-full object-cover" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- 底部版权 -->
    <footer class="border-t border-slate-900 py-8 text-center text-xs text-slate-600">
        <p>© 2026 Doahang Studio. Powered by Cloudflare Pages & Optimized IP.</p>
    </footer>

</body>
</html>
